name: Isolated GitHub Pages V3.2 Preview
on:
  push:
    branches: [preview/github-pages-v32-20261017]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: isolated-pages-v32-review
  cancel-in-progress: false
jobs:
  package:
    name: Exact live root protection + V3.2 Chrome/WebKit QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: {image: "mcr.microsoft.com/playwright:v1.55.0-noble"}
    defaults:
      run:
        shell: bash
    env:
      LIVE_ROOT: "https://mudagiri.github.io/mudagii/"
      PREVIEW_ROOT: "/mudagii/pilot/chapter2-v32/"
      UNIFIED_ROOT: "/mudagii/pilot/chapter123-unified/"
      UNIFIED_SHA: "ca4228495692f13739b39b88b0e71823a9603b95"
      CANDIDATE_SHA: "beee2d39707f5dcd3a31e26e3fd4d1393cc3c9ee"
      CHAPTER3_SHA: "49fbe2d3db9c43fc545f6ee44eed5fb1d102c969"
    steps:
      - name: Checkout current released main, without modifying it
        uses: actions/checkout@v4
        with:
          ref: main
          path: existing
          persist-credentials: false
      - name: Checkout frozen PR 51 candidate
        uses: actions/checkout@v4
        with:
          ref: beee2d39707f5dcd3a31e26e3fd4d1393cc3c9ee
          path: candidate
          persist-credentials: false
      - name: Checkout isolated Chapter 1-3 unified preview
        uses: actions/checkout@v4
        with:
          ref: ca4228495692f13739b39b88b0e71823a9603b95
          path: unified
          persist-credentials: false
      - uses: actions/checkout@v4
        name: Checkout ONLY standalone Chapter 3
        with:
          ref: 49fbe2d3db9c43fc545f6ee44eed5fb1d102c969
          path: chapter3
          persist-credentials: false
      - name: Preserve exact existing GitHub Pages bytes (no main rebuild)
        run: |
          set -euo pipefail
          test "$(git -C existing rev-parse HEAD)" = "f11055dd69629ca598a7fd190fccc379046f165a" || { echo "::error::main changed since last successful Pages deployment"; exit 1; }
          test -d existing/public/assets || { echo "::error::Missing original public asset directory"; exit 1; }
          mkdir -p site/assets
          cp -R existing/public/. site/
          curl --fail --silent --show-error --location --retry 3 -H 'Cache-Control: no-cache' -o site/index.html "$LIVE_ROOT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const html=fs.readFileSync('site/index.html','utf8');
          // Verify the exact JS/CSS recorded by the last main Pages deployment.
          assert.match(html,/\.\/assets\/index-berQLI4S\.js/,'Unexpected main JS revision');
          assert.match(html,/\.\/assets\/index-4Y1XgWA6\.css/,'Unexpected main CSS revision');
          const assets=[...html.matchAll(/(?:src|href)="(\.\/assets\/[^"]+\.(?:js|css))"/g)].map(x=>x[1]);
          assert.equal(assets.length,2,'Expect the published Vite JS and CSS only');
          for(const asset of assets)assert.match(asset,/^\.\/assets\/index-[A-Za-z0-9_-]+\.(?:js|css)$/);
          fs.writeFileSync('/tmp/live-mudagiri-assets.txt',assets.join('\n')+'\n');
          NODE
          while IFS= read -r asset; do
            clean="${asset#./}"
            curl --fail --silent --show-error --location --retry 3 -H 'Cache-Control: no-cache' \
              -o "site/$clean" "$LIVE_ROOT""$clean"
            test -s "site/$clean"
          done </tmp/live-mudagiri-assets.txt
          # public/ is at the exact SHA from the last successful production deployment.
          for file in assets/brand/ogp-1200x630.jpg assets/prebattle/MUDAGIRI_MASTER_CANONICAL_DO_NOT_OVERWRITE.png; do
            test -f "site/$file" || continue
            curl -fsSL --retry 2 -o /tmp/live-public-image "$LIVE_ROOT""$file"
            cmp -s "site/$file" /tmp/live-public-image || { echo "::error::Public assets drifted; deployment blocked"; exit 1; }
          done
          echo "LIVE_PAGES_EXACT_HTML_JS_CSS_AND_MAIN_PUBLIC_SHA_VERIFIED"
      - name: Guard previous previews, permitting verified attach-workflow wipe only
        env:
          PREVIOUS_CH12_SHA: "fa2435b7da43983d9ecc5c445aa731d587bc8de7"
        run: |
          set -euo pipefail
          # Attach Money Personality Pilot Preview run 39020780988 redeployed
          # the root+Pilot, dropping Chapter 1/2 and unified subdirectories.
          # A missing path is recoverable when the existing root+Pilot are
          # preserved byte-for-byte. Unknown published SHAs are not.
          for entry in "pilot/chapter2-v32/:$PREVIOUS_CH12_SHA" "pilot/chapter123-unified/:$UNIFIED_SHA"; do
            prefix="${entry%%:*}"
            expected="${entry#*:}"
            code="$(curl --silent --show-error --location -H 'Cache-Control: no-cache'               -o /tmp/previous-preview-check -w '%{http_code}' "$LIVE_ROOT""$prefix")"
            if [ "$code" = 200 ]; then
              grep -Fq "$expected" /tmp/previous-preview-check || { echo "::error::Unknown published preview at $prefix; refusing replacement"; exit 1; }
            elif [ "$code" = 404 ]; then
              echo "KNOWN_PILOT_ATTACH_DROPPED_PREVIEW_PATH $prefix"
            else
              echo "::error::Unable to establish current preview status $prefix: $code"; exit 1
            fi
          done
      - name: Retrieve exact already published production plus original Pilot
        uses: actions/download-artifact@v4
        with:
          repository: mudagiri/mudagii
          run-id: 39020780988
          name: github-pages-money-preview-39020780988-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./published-pilot-site
      - name: Preserve byte-for-byte current published production and standalone Pilot
        run: |
          set -euo pipefail
          test -s published-pilot-site/artifact.tar || { echo "::error::Expected pinned published Pilot artifact unavailable"; exit 1; }
          rm -rf site
          mkdir site
          tar -xf published-pilot-site/artifact.tar -C site
          test -s site/index.html
          test -s site/pilot/money-type/index.html
          curl -fsSL --retry 3 -H 'Cache-Control: no-cache' "$LIVE_ROOT" -o /tmp/current-root-index
          cmp -s /tmp/current-root-index site/index.html || { echo "::error::Pinned production HTML differs from current live site"; exit 1; }
          curl -fsSL --retry 3 -H 'Cache-Control: no-cache' "$LIVE_ROOT""pilot/money-type/" -o /tmp/current-pilot-index
          cmp -s /tmp/current-pilot-index site/pilot/money-type/index.html || { echo "::error::Pinned Pilot differs from current live Pilot"; exit 1; }
          # Compare the actual Pilot app's entry JS/CSS byte-for-byte, not just HTML.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('site/pilot/money-type/index.html','utf8');
          const paths=[...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(x=>x[1]);
          if(paths.length<1)throw new Error('Missing Pilot published JS/CSS assets');
          fs.writeFileSync('/tmp/pilot-current-entry-assets',paths.join('\n')+'\n');
          NODE
          while IFS= read -r asset; do
            clean="${asset#./}"
            clean="${clean#/}"
            test -f "site/pilot/money-type/$clean" || { echo "::error::Pilot entry missing from preserved artifact: $clean"; exit 1; }
            curl -fsSL --retry 3 -H 'Cache-Control: no-cache'               "$LIVE_ROOT""pilot/money-type/$clean" -o /tmp/current-pilot-asset
            cmp -s /tmp/current-pilot-asset "site/pilot/money-type/$clean" || { echo "::error::Published Pilot JS/CSS differs: $clean"; exit 1; }
          done </tmp/pilot-current-entry-assets
          echo "EXACT_PUBLISHED_PRODUCTION_AND_PILOT_PRESERVED_PASS"
      - name: Build Chapter 1/2 V3.2 preview, no GAS writes
        working-directory: candidate
        env:
          VITE_CHAPTER2_V32: "1"
          VITE_MUDAGIRI_GAS_URL: ""
          VITE_MONEY_PERSONALITY_GAS_URL: ""
          VITE_MONEY_PERSONALITY_DATA_COHORT: PILOT
        run: |
          set -euo pipefail
          npm ci
          npm run build -- --base="$PREVIEW_ROOT"
          npm run qa:public-chapter12-entry
          npx --yes tsx@4.20.6 qa-chapter2-v32.ts
          npx --yes tsx@4.20.6 qa-comparable-income-matrix-v1.ts
          npx --yes tsx@4.20.6 qa-income-class-worker-burden-rate-v1.ts
          npx --yes tsx@4.20.6 qa-chapter2-v32.ts
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' dist/assets/*.js
      - name: Build Chapter 1-3 unified preview using the same frozen design, no GAS
        working-directory: unified
        env:
          VITE_CHAPTER2_V32: "1"
          VITE_CHAPTER3_PREVIEW: "1"
          VITE_MUDAGIRI_GAS_URL: ""
          VITE_MONEY_PERSONALITY_GAS_URL: ""
          VITE_MONEY_PERSONALITY_DATA_COHORT: PILOT
        run: |
          set -euo pipefail
          npm ci
          npm run build -- --base="$UNIFIED_ROOT"
          node scripts/qa-chapter3-three-forces-v11.mjs
          node scripts/qa-chapter3-result-v11-static.mjs
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' dist/assets/*.js
          test -f dist/pilot/chapter3-v11/index.html
          test -f dist/pilot/chapter3-v11/unified-chapter12.css
      - name: Assemble site with identical main and isolated candidate
        run: |
          set -euo pipefail
          mkdir -p site/pilot/chapter2-v32/pilot/money-type
          cp -R candidate/dist/. site/pilot/chapter2-v32/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base='/mudagii/pilot/chapter2-v32/';
          const p='site/pilot/chapter2-v32/index.html';
          const raw=fs.readFileSync(p,'utf8');
          assert.match(raw,/<head>/);
          assert.match(raw,/\/mudagii\/pilot\/chapter2-v32\/assets\//);
          const html=raw.replace('<head>','<head><base href="'+base+'"><meta name="robots" content="noindex,nofollow"><meta name="mudagiri-preview-sha" content="'+process.env.CANDIDATE_SHA+'">');
          fs.writeFileSync(p,html);
          fs.writeFileSync('site/pilot/chapter2-v32/pilot/money-type/index.html',html);
          assert.match(fs.readFileSync('site/index.html','utf8'),/index-berQLI4S\.js/);
          console.log('PAGES_LIVE_ROOT_UNCHANGED_CANDIDATE_ADDED_PASS');
          NODE
      - name: Add strictly isolated chapter 1-3 subpath, without altering live root or V3.2
        run: |
          set -euo pipefail
          mkdir -p site/pilot/chapter123-unified/pilot/money-type
          cp -R unified/dist/. site/pilot/chapter123-unified/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base='/mudagii/pilot/chapter123-unified/';
          const file='site/pilot/chapter123-unified/index.html';
          const html=fs.readFileSync(file,'utf8');
          assert.match(html,/<head>/);
          assert.match(html,/\/mudagii\/pilot\/chapter123-unified\/assets\//);
          const output=html.replace('<head>','<head><base href="'+base+'"><meta name="robots" content="noindex,nofollow"><meta name="mudagiri-unified-sha" content="'+process.env.UNIFIED_SHA+'">');
          fs.writeFileSync(file,output);
          fs.writeFileSync('site/pilot/chapter123-unified/pilot/money-type/index.html',output);
          assert.ok(fs.existsSync('site/pilot/chapter123-unified/pilot/chapter3-v11/index.html'));
          assert.match(fs.readFileSync('site/index.html','utf8'),/index-berQLI4S\.js/);
          console.log('UNIFIED_ADDED_ROOT_AND_EXISTING_V32_PRESERVED');
          NODE
      - name: Build self-contained Chapter 3 stage only
        working-directory: chapter3
        env:
          VITE_MUDAGIRI_GAS_URL: ""
          VITE_MONEY_PERSONALITY_GAS_URL: ""
        run: |
          set -euo pipefail
          npm ci
          node scripts/qa-chapter3-three-forces-v11.mjs
          node --check public/pilot/chapter3-v12/stage.mjs
          npm run build -- --base=/mudagii/
          test -f dist/pilot/chapter3-v12/engine.mjs
          test -f dist/pilot/chapter3-v12/story.mjs
          test -f dist/pilot/chapter3-v12/story.css
          test -f dist/pilot/chapter3-v12/motivation.mjs
      - name: Overlay Chapter 3 v12 as an entirely new directory
        run: |
          set -euo pipefail
          test ! -e site/pilot/chapter3-v12
          cp -R chapter3/dist/pilot/chapter3-v12 site/pilot/chapter3-v12
          # Bundle only Chapter 3's official art into its own subpath.
          # The live root and Chapters 1/2 asset directory remain byte-identical.
          for asset in \
            brand/favicon-32.png \
            jobs/v1/JOB_01_FDM_elephant.webp \
            mudagiri/poses/v1/MUDAGIRI_POSE_03_GUIDE.webp \
            mudagiri/poses/v1/MUDAGIRI_POSE_20_CHECK.webp \
            mudagiri/poses/v1/MUDAGIRI_POSE_23_RESULT.webp \
            mudagiri/backgrounds/money-personality/v1/MP_BG_01_GUILD_HALL.webp \
            mudagiri/backgrounds/money-personality/v1/MP_BG_03_NEXT_QUEST.webp; do
            test -f "chapter3/dist/assets/$asset"
            mkdir -p "site/pilot/chapter3-v12/assets/$(dirname "$asset")"
            cp "chapter3/dist/assets/$asset" "site/pilot/chapter3-v12/assets/$asset"
          done
          # All CH3 URLs now resolve within /pilot/chapter3-v12/ only.
          sed -i 's#../../assets/#./assets/#g' \
            site/pilot/chapter3-v12/index.html \
            site/pilot/chapter3-v12/stage.mjs \
            site/pilot/chapter3-v12/stage.css
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p='site/pilot/chapter3-v12/index.html',h=fs.readFileSync(p,'utf8');
          fs.writeFileSync(p,h.replace('<head>','<head><meta name="mudagiri-chapter3-sha" content="'+process.env.CHAPTER3_SHA+'">'));
          for (const a of ['mudagiri/poses/v1/MUDAGIRI_POSE_03_GUIDE.webp','mudagiri/backgrounds/money-personality/v1/MP_BG_03_NEXT_QUEST.webp','jobs/v1/JOB_01_FDM_elephant.webp'])assert.ok(fs.existsSync('site/pilot/chapter3-v12/assets/'+a),'Official Chapter 3 art missing');
          console.log('CHAPTER3_NEW_PATH_ONLY_PASS');
          NODE
      - name: Install browser runner and launch same-origin staging
        working-directory: candidate
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Launch GitHub Pages path simulation
        run: |
          mkdir -p staging
          ln -s ../site staging/mudagii
          python3 -m http.server 4173 --bind 127.0.0.1 --directory staging >/tmp/pages-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/mudagii/pilot/chapter2-v32/pilot/money-type/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/pages-preview.log
          exit 1
      - name: Verify old root + new deep-link HTML
        run: |
          set -euo pipefail
          curl -fsSL http://127.0.0.1:4173/mudagii/ -o /tmp/staging-root
          cmp -s /tmp/staging-root site/index.html
          curl -fsSL http://127.0.0.1:4173/mudagii/pilot/chapter2-v32/ | grep -q mudagiri-preview-sha
          curl -fsSL http://127.0.0.1:4173/mudagii/pilot/chapter2-v32/pilot/money-type/ | grep -q mudagiri-preview-sha
          curl -fsSL http://127.0.0.1:4173/mudagii/pilot/chapter123-unified/ | grep -q mudagiri-unified-sha
          curl -fsSL http://127.0.0.1:4173/mudagii/pilot/chapter123-unified/pilot/money-type/ | grep -q mudagiri-unified-sha
          test -s site/pilot/chapter123-unified/pilot/chapter3-v11/result.css
      - name: Chrome chapter 1 to 2 browser journey
        working-directory: candidate
        env:
          BROWSER_ENGINE: chromium
          INTEGRATION_URL: "http://127.0.0.1:4173/mudagii/pilot/chapter2-v32/"
        run: node qa-chapters-v32-browser.mjs
      - name: iPhone WebKit chapter 1 to 2 browser journey
        working-directory: candidate
        env:
          BROWSER_ENGINE: webkit
          INTEGRATION_URL: "http://127.0.0.1:4173/mudagii/pilot/chapter2-v32/"
        run: node qa-chapters-v32-browser.mjs
      - name: Install unified Chrome/WebKit runner
        working-directory: unified
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Chapter 3 isolated result visual QA — Chrome / WebKit, all 8 cases
        working-directory: unified
        env:
          CH3_PREVIEW_URL: "http://127.0.0.1:4173/mudagii/pilot/chapter123-unified/pilot/chapter3-v11/"
        run: node scripts/qa-chapter3-result-v11-browser.mjs
      - name: Unified chapter 1 -> 2 regression — Chrome
        working-directory: unified
        env:
          BROWSER_ENGINE: chromium
          INTEGRATION_URL: "http://127.0.0.1:4173/mudagii/pilot/chapter123-unified/"
        run: node qa-chapters-v32-browser.mjs
      - name: Unified chapter 1 -> 2 regression — WebKit
        working-directory: unified
        env:
          BROWSER_ENGINE: webkit
          INTEGRATION_URL: "http://127.0.0.1:4173/mudagii/pilot/chapter123-unified/"
        run: node qa-chapters-v32-browser.mjs
      - name: Install Chapter 3 browser QA
        working-directory: chapter3
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Real GitHub Pages path Chapter 3 quest QA
        working-directory: chapter3
        env:
          CHAPTER3_STAGE_URL: "http://127.0.0.1:4173/mudagii/pilot/chapter3-v12/"
        run: node scripts/qa-chapter3-stage-v12-browser.mjs
      - name: Upload Chapter 3 QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter3-v12-publication-check
          path: chapter3/artifacts/chapter3-stage/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload unified QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-chapter123-review-screens
          path: |
            unified/artifacts/chapter3-v11/
            unified/integration-v32-mobile-qa/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload synthetic-only QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-v32-review-screens
          path: candidate/integration-v32-mobile-qa/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    name: Add only the reviewed subpath to GitHub Pages
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish validated composite Pages artifact
        id: publish
        uses: actions/deploy-pages@v4
      - name: Verify actual public review URL and exact commit
        env:
          LIVE_ROOT: "https://mudagiri.github.io/mudagii/"
          CANDIDATE_SHA: "beee2d39707f5dcd3a31e26e3fd4d1393cc3c9ee"
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$LIVE_ROOT""pilot/chapter2-v32/" | grep -q "$CANDIDATE_SHA"; then
              echo "PUBLIC_GITHUB_PAGES_V32_PREVIEW_VERIFIED"
              echo "URL: $LIVE_ROOT""pilot/chapter2-v32/"
              for j in $(seq 1 15); do
                if curl -fsSL -H 'Cache-Control: no-cache' "$LIVE_ROOT""pilot/chapter123-unified/" | grep -q "ca4228495692f13739b39b88b0e71823a9603b95"; then
                  curl -fsSL "$LIVE_ROOT""pilot/chapter123-unified/pilot/chapter3-v11/" | grep -q 'chapter3-result-root'
                  echo "PUBLIC_CHAPTER123_UNIFIED_VERIFIED"
                  echo "URL: $LIVE_ROOT""pilot/chapter123-unified/"
                  for k in $(seq 1 15); do
                    if curl -fsSL -H 'Cache-Control: no-cache' "$LIVE_ROOT""pilot/chapter3-v12/" | grep -q "49fbe2d3db9c43fc545f6ee44eed5fb1d102c969"; then
                      curl -fsSL "$LIVE_ROOT""pilot/chapter3-v12/stage.mjs" | grep -q 'evaluateChapter3'
                      echo "PUBLIC_CHAPTER3_V12_NEW_STAGE_VERIFIED"
                      echo "URL: $LIVE_ROOT""pilot/chapter3-v12/"
                      exit 0
                    fi
                    sleep 6
                  done
                  echo "::error::Chapter 3 preview missing/mismatched SHA"; exit 1
                fi
                sleep 6
              done
              echo "::error::Chapter123 unified public preview missing/mismatched SHA"
              exit 1
              exit 0
            fi
            sleep 6
          done
          echo "::error::Public preview did not serve the expected commit"
          exit 1
