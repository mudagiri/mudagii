name: Probe Money Personality GAS (synthetic)

on:
  push:
    branches:
      - audit/money-personality-real-prevalence-pipeline-20261009
    paths:
      - 'scripts/money-personality-backend-probe.mjs'
      - '.github/workflows/money-personality-backend-probe.yml'
  pull_request:
    branches:
      - audit/money-personality-prevalence-sensitivity-20261009
    paths:
      - 'scripts/money-personality-backend-probe.mjs'
      - '.github/workflows/money-personality-backend-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: money-personality-backend-probe
  cancel-in-progress: false

jobs:
  probe:
    # Never run privileged probe code from fork PRs or unrelated branches.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == 'mudagiri/mudagii' && github.event.pull_request.head.ref == 'audit/money-personality-real-prevalence-pipeline-20261009') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dedicated backend GET + debug-only POST twice
        env:
          VITE_MONEY_PERSONALITY_GAS_URL: ${{ secrets.VITE_MONEY_PERSONALITY_GAS_URL }}
        run: node scripts/money-personality-backend-probe.mjs
