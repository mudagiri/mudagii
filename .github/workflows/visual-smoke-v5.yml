name: V5 Visual Smoke

on:
  push:
    branches: ["main", "feature/money-personality-pilot"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: visual-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install app
        run: npm ci
      - name: Install matching Playwright package
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/mudagiri-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/mudagiri-vite.log
          exit 1
      - name: Run 390x844 V5 visual smoke
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4173/
        run: node qa-visual-smoke-v5.mjs
      - name: Run adaptive JOB public browser smoke
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4173/
        run: node qa-money-personality-public-browser-v1.mjs
      - name: Audit Mudagiri optical bounds
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4173/
        run: node qa-mudagiri-optical-bounds-v1.mjs
      - name: Run cognitive pilot browser smoke
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4173/
        run: node qa-money-personality-cognitive-browser-v1.mjs
      - name: Run iPhone WebKit Safari-engine responsive smoke
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4173/
        run: node qa-money-personality-ios-webkit-v1.mjs
      - name: Upload screenshots and geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-visual-smoke
          path: visual-smoke-v5/
          if-no-files-found: warn
          retention-days: 7