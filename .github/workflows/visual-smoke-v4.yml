name: V4 Visual Smoke
# result-viral-loop-v1 visual gate

on:
  push:
    branches: ["v4-scope-contract", "result-cv-v1", "line-handoff-v1", "result-experience-v2", "result-viral-loop-v1", "consult-routing-v1", "result-polish-v3", "result-visual-polish-v4", "result-gap-color-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install app
        run: npm ci
      - name: Install matching Playwright package
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/mudagiri-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/mudagiri-vite.log
          exit 1
      - name: Run 390x844 visual smoke
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4173/
        run: node qa-visual-smoke-v4.mjs
      - name: Upload screenshots and geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-visual-smoke
          path: visual-smoke-v4/
          if-no-files-found: warn
          retention-days: 7
