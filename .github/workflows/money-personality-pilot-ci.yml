name: Validate Money Personality Pilot

on:
  push:
    branches:
      - feature/money-personality-pilot
      - fix/money-personality-result-calibration-20261009
      - audit/money-personality-boundary-type32-20261009
      - audit/money-personality-real-prevalence-pipeline-20261009
      - fix/money-personality-cohort-prevalence-20261009
  pull_request:
    branches:
      - main
      - feature/money-personality-pilot
      - audit/money-personality-prevalence-sensitivity-20261009
      - audit/money-personality-real-prevalence-pipeline-20261009
    paths:
      - 'src/features/money-personality/**'
      - 'src/main.tsx'
      - 'scripts/money-personality-backend-probe.mjs'
      - 'scripts/check-money-personality-gas-health.mjs'
      - 'scripts/verify-money-personality-build.mjs'
      - '.github/workflows/deploy-money-personality-hidden-preview.yml'
      - '.github/workflows/attach-money-personality-preview.yml'
      - 'qa-money-personality-*.ts'
      - 'qa-money-personality-*.mjs'
      - 'MUDAGIRI_MONEY_PERSONALITY_GAS_V1.gs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/money-personality-pilot-ci.yml'

permissions:
  contents: read

concurrency:
  group: money-personality-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Verify chapter-specific OGP without changing production index
        run: |
          cp dist/index.html /tmp/money-personality-og.html
          node scripts/prepare-money-personality-preview-og.mjs /tmp/money-personality-og.html
          grep -q 'お金の性格診断｜ムダギリ診断（32タイプ）' /tmp/money-personality-og.html
          grep -q 'property="og:url"' /tmp/money-personality-og.html
          grep -q 'twitter:description' /tmp/money-personality-og.html
      - name: Public flow QA
        run: npm run qa:money-public-flow
      - name: Public Chapter 1 routing, legacy isolation QA
        run: npm run qa:money-entry
      - name: Engine QA
        run: npm run qa:money-engine
      - name: Result content QA
        run: npm run qa:money-result-content
      - name: Result persona QA
        run: npm run qa:money-result-personas
      - name: Everyday scene resonance QA
        run: npm run qa:money-scenes
      - name: Result calibration and 32 TYPE scene QA
        run: npm run qa:money-calibration
      - name: Synthetic boundary stress 10k
        run: npm run qa:money-boundary-10k
      - name: Hypothetical prevalence sensitivity QA
        run: npm run qa:money-prevalence
      - name: Type 32 semantic guard QA
        run: npm run qa:money-semantic
      - name: Cognitive pilot instrument QA
        run: npm run qa:money-cognitive
      - name: GAS transport retry guard
        run: npm run qa:money-delivery
      - name: Real prevalence aggregation and exclusions QA
        run: npm run qa:money-real-prevalence
      - name: Dedicated GAS real doPost upsert + cohort offline integration QA
        run: node qa-money-personality-gas-upsert-v1.mjs
      - name: GAS backend separation guard
        run: node qa-money-personality-backend-separation-v1.mjs
      - name: Guard hidden preview against missing GAS URL
        run: node qa-money-personality-release-gate-v1.mjs
      - name: Reject wrong backend, missing transport, or missing deploy revision proof
        run: node qa-money-personality-backend-contract-v1.mjs
      - name: Pilot QA
        run: npm run qa:money-pilot

  dedicated-gas-readonly:
    # Only the trusted, same-repository PR branch may inspect environment-scoped
    # endpoint health; no POSTs and no values are written to the logs.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/money-personality-cohort-prevalence-20261009' }}
    environment: pilot-hidden-preview
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify dedicated GAS GET health without sending a session
        env:
          VITE_MONEY_PERSONALITY_GAS_URL: ${{ secrets.VITE_MONEY_PERSONALITY_GAS_URL || vars.VITE_MONEY_PERSONALITY_GAS_URL }}
        run: node scripts/check-money-personality-gas-health.mjs
