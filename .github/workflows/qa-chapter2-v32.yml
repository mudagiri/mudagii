name: Chapter 2 V32 Possibility Reward QA
on:
  push:
    branches:
      - feat/chapter2-result-v32-possible-rewards-20261011
  pull_request:
    branches:
      - feat/chapter2-result-v31-guild-reward-20261011
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check V3.2 possibility-first, zero-state and cumulative copy
        run: npm run qa:chapter2-v32
      - name: Regression V3.1 presentation remains unchanged
        run: npm run qa:chapter2-v31
      - name: Check original V5 result semantics
        run: npm run qa:result-v5
      - name: Strict TypeScript and production bundle
        env:
          VITE_CHAPTER2_V32: '1'
          VITE_MUDAGIRI_GAS_URL: ''
          VITE_MONEY_PERSONALITY_GAS_URL: ''
        run: npm run build
