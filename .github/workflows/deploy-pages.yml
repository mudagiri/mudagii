name: Deploy Mudagiri to GitHub Pages

on:
  workflow_run:
    workflows: ["Validate Diagnosis V2.1"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  visual-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install app
        run: npm ci
      - name: Install matching Playwright package
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Build release candidate
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/mudagiri-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/mudagiri-vite.log
          exit 1
      - name: Run V5 visual release gate
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4173/
        run: node qa-visual-smoke-v5.mjs
      - name: Upload release-gate screenshots and geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-v5-visual-gate
          path: visual-smoke-v5/
          if-no-files-found: warn
          retention-days: 7

  build:
    needs: visual-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact dependencies
        run: npm ci
      - name: Build
        env:
          VITE_MUDAGIRI_GAS_URL: ${{ secrets.VITE_MUDAGIRI_GAS_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
