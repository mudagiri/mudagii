name: QA Chapter1-2 Annual Income Step (test-only)

on:
  pull_request:
    branches:
      - release/chapter12-latest-rpg-ui-first-20261016
    paths:
      - 'qa-persona-v4-e2e.ts'
      - 'qa-visual-smoke-v5.mjs'
      - '.github/workflows/qa-chapter12-annual-income-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  annual-income-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      VITE_MUDAGIRI_GAS_URL: ""
      VITE_MONEY_PERSONALITY_GAS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dependencies
        run: npm ci
      - name: Compile and verify V4 persona flow (no GAS)
        run: |
          npm run build
          npm run qa:persona-v4
          npm run qa:profile-v4-ux
      - name: Install matching browser runner
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Start isolated preview
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/mudagiri-v5-smoke.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/mudagiri-v5-smoke.log
          exit 1
      - name: Verify V5 390x844 browser scenes
        env:
          VISUAL_BASE_URL: "http://127.0.0.1:4173/"
        run: node qa-visual-smoke-v5.mjs
      - name: Upload synthetic-only V5 QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter12-annual-income-qa-visual
          path: visual-smoke-v5/
          retention-days: 7
          if-no-files-found: warn
