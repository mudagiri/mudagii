name: Attach Money Personality Pilot Preview

on:
  workflow_run:
    workflows:
      - "Deploy Mudagiri to GitHub Pages"
      - "Validate Diagnosis V2.1"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-money-preview-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      pilot_sha: ${{ steps.capture_pilot_sha.outputs.sha }}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          ref: feature/money-personality-pilot
          path: pilot-site

      - name: Capture exact pilot build revision
        id: capture_pilot_sha
        run: echo "sha=$(git -C pilot-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main-site/package-lock.json
            pilot-site/package-lock.json

      - name: Build current production root
        working-directory: main-site
        env:
          VITE_MUDAGIRI_GAS_URL: ${{ secrets.VITE_MUDAGIRI_GAS_URL }}
        run: |
          npm ci
          npm run build

      - name: Require dedicated Money Personality GAS endpoint before preview publish
        env:
          VITE_MONEY_PERSONALITY_GAS_URL: ${{ secrets.VITE_MONEY_PERSONALITY_GAS_URL }}
        run: |
          if [[ -z "$VITE_MONEY_PERSONALITY_GAS_URL" ]]; then
            echo "::error::Dedicated Money Personality GAS URL is unavailable; hidden preview deployment blocked."
            exit 1
          fi
          if [[ "$VITE_MONEY_PERSONALITY_GAS_URL" != https://script.google.com/macros/s/*/exec ]]; then
            echo "::error::Dedicated Money Personality GAS URL has an unexpected format; hidden preview deployment blocked."
            exit 1
          fi
      - name: Verify this is the dedicated Money Personality GAS (read only)
        env:
          VITE_MONEY_PERSONALITY_GAS_URL: ${{ secrets.VITE_MONEY_PERSONALITY_GAS_URL }}
        run: node pilot-site/scripts/check-money-personality-gas-health.mjs

      - name: Build pilot candidate
        working-directory: pilot-site
        env:
          VITE_MUDAGIRI_GAS_URL: ${{ secrets.VITE_MUDAGIRI_GAS_URL }}
          VITE_MONEY_PERSONALITY_GAS_URL: ${{ secrets.VITE_MONEY_PERSONALITY_GAS_URL }}
        run: |
          npm ci
          npm run build
          node scripts/verify-money-personality-build.mjs
          npm run qa:money-pilot

      - name: Assemble production root + hidden pilot preview
        run: |
          mkdir -p site
          cp -R main-site/dist/. site/
          mkdir -p site/pilot/money-type
          cp -R pilot-site/dist/. site/pilot/money-type/
          git -C pilot-site rev-parse HEAD > site/pilot/money-type/REVISION_SHA.txt
          node pilot-site/scripts/prepare-money-personality-preview-og.mjs site/pilot/money-type/index.html
          test -f site/index.html
          test -f site/pilot/money-type/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-money-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy production root with hidden pilot preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-money-preview-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify published Hidden Preview revision matches built SHA
        env:
          DEPLOY_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_PILOT_SHA: ${{ needs.build.outputs.pilot_sha }}
        run: |
          if [[ -z "$DEPLOY_PAGE_URL" || -z "$EXPECTED_PILOT_SHA" ]]; then
            echo "::error::Missing deployment URL or captured build revision"
            exit 1
          fi
          base="${DEPLOY_PAGE_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            actual="$(curl -fsSL --max-time 12 "$base/pilot/money-type/REVISION_SHA.txt" 2>/dev/null | tr -d '\r\n' || true)"
            if [[ "$actual" == "$EXPECTED_PILOT_SHA" ]]; then
              echo "Chapter 1 published SHA matches built candidate."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Published Hidden Preview revision is missing or differs from the built candidate"
          exit 1
