# Keep this manual documentation job for historical workflow links.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-publisher:
    runs-on: ubuntu-latest
    steps:
      - name: Preview publishing ownership
        run: |
          echo "This workflow no longer deploys GitHub Pages."
          echo "Deploy Mudagiri to GitHub Pages -> Restore Isolated Previews After Production Deployment"
          echo "is the only supported publication chain."
