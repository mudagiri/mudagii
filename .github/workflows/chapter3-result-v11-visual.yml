name: Chapter 3 V1.1 Isolated Result Visual QA

on:
  push:
    branches:
      - feat/chapter3-v11-rpg-result-isolated-20261017
  pull_request:
    paths:
      - "public/pilot/chapter3-v11/**"
      - "scripts/chapter3-three-forces-v11.mjs"
      - "scripts/qa-chapter3-*v11*.mjs"
      - ".github/workflows/chapter3-result-v11-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  result-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      VITE_MUDAGIRI_GAS_URL: ""
      VITE_MONEY_PERSONALITY_GAS_URL: ""
      VITE_MONEY_PERSONALITY_DATA_COHORT: PILOT
    steps:
      - uses: actions/checkout@v4
      - name: Node dependencies
        run: npm ci
      - name: Install matching Playwright browser runner
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Rule-engine QA
        run: |
          node scripts/qa-chapter3-three-forces-v11.mjs
          node scripts/qa-chapter3-result-v11-static.mjs
      - name: Build without external backends
        run: |
          npm run build
          test -f dist/pilot/chapter3-v11/index.html
          test -f dist/pilot/chapter3-v11/result.mjs
          cmp scripts/chapter3-three-forces-v11.mjs dist/pilot/chapter3-v11/engine.mjs
      - name: Serve isolated preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/ch3-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/pilot/chapter3-v11/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/ch3-preview.log
          exit 1
      - name: Chrome and iPhone WebKit across 320 to 430 px
        run: node scripts/qa-chapter3-result-v11-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter3-v11-rpg-result-screenshots
          path: artifacts/chapter3-v11/
          if-no-files-found: warn
          retention-days: 7
