name: Chapter 3 New-Stage V1.2 QA
on:
  push:
    branches:
      - feat/chapter3-v11-rpg-result-isolated-20261017
    paths:
      - "public/pilot/chapter3-v12/**"
      - "public/pilot/chapter3-v11/engine.mjs"
      - "scripts/qa-chapter3-stage-v12-browser.mjs"
      - "scripts/qa-chapter3-motivation-v13.mjs"
      - ".github/workflows/chapter3-stage-v12.yml"
  pull_request:
    paths:
      - "public/pilot/chapter3-v12/**"
      - "public/pilot/chapter3-v11/engine.mjs"
      - "scripts/qa-chapter3-stage-v12-browser.mjs"
      - ".github/workflows/chapter3-stage-v12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      VITE_MUDAGIRI_GAS_URL: ""
      VITE_MONEY_PERSONALITY_GAS_URL: ""
      VITE_CHAPTER3_PREVIEW: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser runner
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
      - name: Verify syntax and isolated source
        run: |
          node --check public/pilot/chapter3-v12/stage.mjs
          node --check scripts/qa-chapter3-stage-v12-browser.mjs
          node --check public/pilot/chapter3-v12/motivation.mjs
          node scripts/qa-chapter3-motivation-v13.mjs
          node scripts/qa-chapter3-three-forces-v11.mjs
          node scripts/qa-chapter3-result-v11-static.mjs
      - name: Build with no external backends
        run: |
          npm run build
          test -f dist/pilot/chapter3-v12/index.html
          test -f dist/pilot/chapter3-v12/stage.mjs
          test -f dist/pilot/chapter3-v12/stage.css
          test -f dist/pilot/chapter3-v12/motivation.mjs
          test -f dist/pilot/chapter3-v12/motivation.css
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' dist/assets/*.js
      - name: Serve Chapter 3 only
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/ch3-v12.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/pilot/chapter3-v12/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/ch3-v12.log
          exit 1
      - name: Chromium and iPhone WebKit complete chapter3 quest
        run: node scripts/qa-chapter3-stage-v12-browser.mjs
      - name: QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter3-v12-next-stage-mobile-qa
          path: artifacts/chapter3-stage/
          if-no-files-found: warn
          retention-days: 14
