name: Validate Diagnosis V2.1

on:
  push:
    branches:
      - main
      - diagnosis-v2-1-frozen
      - qa-mobile-ui-v1
      - diagnosis-result-v3-2
      - v4-scope-contract
      - consult-routing-v1
      - result-polish-v3
      - result-visual-polish-v4
      - result-gap-color-v1
      - result-mudagiri-dialogue-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run qa:money-pilot
      - run: npm run qa:money-engine
      - run: npm run qa:money-separators
      - run: npm run qa:money-public-flow
      - run: npm run qa:money-result-content
      - run: npm run qa:money-result-personas
      - run: npm run qa:money-cognitive
      - run: npm run qa:resolver
      - run: npm run qa:scope
      - run: npm run qa:profile-v4-ux
      - run: npm run qa:appraisal-flow
      - run: npm run qa:persona
      - run: npm run qa:persona-v4
      - run: npm run qa:type
      - run: npm run qa:battle
      - run: npm run qa:resume
      - run: npm run qa:result-safety
      - run: npm run qa:result-cv
      - run: npm run qa:result-experience
      - run: npm run qa:result-viral
      - run: npm run qa:consult-routing
      - run: npm run qa:result-polish
      - run: npm run qa:result-visual
      - run: npm run qa:result-v5
      - run: npm run qa:result-v5-calibration
      - run: npm run qa:line-handoff
      - run: npm run qa:data-pipeline
      - run: npm run qa:10k