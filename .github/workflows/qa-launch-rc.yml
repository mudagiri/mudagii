name: Chapters Launch RC Gate
on:
  push:
    branches:
      - release/chapter1-chapter2-launch-gate-20261011
  pull_request:
    branches:
      - feat/chapter2-result-v32-possible-rewards-20261011
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chapters-launch-rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/chapter1-chapter2-launch-gate-20261011
      - run: npm ci
      - name: Chapter bridge, privacy and official LINE static guard
        run: node scripts/launch-rc-static-guard.mjs
      - name: Frozen result and integration regression
        run: |
          npm run qa:chapter2-v31
          npm run qa:chapter2-v32
          npm run qa:result-v5
          npm run qa:money-entry
          npm run qa:money-public-flow
          npm run qa:money-result-content
          npm run qa:resume
          npm run qa:consult-routing
      - name: Install browser runner
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Build isolated V32 launch candidate with no GAS writes
        env:
          VITE_CHAPTER2_V32: '1'
          VITE_MONEY_PERSONALITY_DATA_COHORT: PILOT
          VITE_MONEY_PERSONALITY_GAS_URL: ''
          VITE_MUDAGIRI_GAS_URL: ''
        run: |
          npm run build
          mkdir -p site/pilot/chapter2-v32/pilot/money-type
          cp -R dist/. site/pilot/chapter2-v32/
          cp -R dist/. site/pilot/chapter2-v32/pilot/money-type/
          if grep -R -l -E 'script.google.com/macros/s/.+/exec' site/pilot/chapter2-v32/assets/*.js; then
            echo 'Unexpected GAS write URL in offline RC'
            exit 1
          fi
      - name: Start local RC server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/launch-rc.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/pilot/chapter2-v32/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/launch-rc.log
          exit 1
      - name: End-to-end from Chapter 1 to Chapter 2 in Chrome
        env:
          BROWSER_ENGINE: chromium
          INTEGRATION_URL: http://127.0.0.1:4173/pilot/chapter2-v32/
        run: node qa-chapters-v32-browser.mjs
      - name: End-to-end from Chapter 1 to Chapter 2 in WebKit
        env:
          BROWSER_ENGINE: webkit
          INTEGRATION_URL: http://127.0.0.1:4173/pilot/chapter2-v32/
        run: node qa-chapters-v32-browser.mjs
      - name: Keep Chapter 1 and Chrome result screenshots for approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-rc-chapter1-chapter2-screenshots
          path: integration-v32-mobile-qa/
          if-no-files-found: warn
          retention-days: 14
