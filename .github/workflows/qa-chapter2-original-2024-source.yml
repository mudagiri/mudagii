name: Chapter 2 Original 2024 e-Stat Source Inspection
on:
  pull_request:
    branches: [release/chapter12-latest-rpg-ui-first-20261016]
    paths:
      - scripts/extract-chapter2-official-peer-original-2024.py
      - .github/workflows/qa-chapter2-original-2024-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract-official-original:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download original government Excel, no credential or user data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mudagiri-official-2024
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 180 \
            -H 'User-Agent: Mozilla/5.0 (compatible; data provenance audit)' \
            'https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040379261&fileKind=0' \
            -o /tmp/mudagiri-official-2024/a010292.xlsx
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 180 \
            -H 'User-Agent: Mozilla/5.0 (compatible; data provenance audit)' \
            'https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040379262&fileKind=0' \
            -o /tmp/mudagiri-official-2024/a010293.xlsx
          echo '0a73765d1cda9c6c2a0ba8238e2260ee595dfbdbbbb91b67aa1abb55adf82c45  /tmp/mudagiri-official-2024/a010292.xlsx' | sha256sum -c
          echo '62648369c8f550afb849575d34bb4a8ed3935c7b8d7dcc8f28bde7ecbdfe16a2  /tmp/mudagiri-official-2024/a010293.xlsx' | sha256sum -c
      - name: Extract candidates and raw original cells for manual classification
        shell: bash
        run: |
          python3 scripts/extract-chapter2-official-peer-original-2024.py \
            --multi /tmp/mudagiri-official-2024/a010292.xlsx \
            --single /tmp/mudagiri-official-2024/a010293.xlsx \
            --output /tmp/mudagiri-official-2024/source-candidates.json
      - name: Upload SHA-verified original row extract
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-2024-official-original-12category-inspection
          path: /tmp/mudagiri-official-2024/source-candidates.json
          retention-days: 14
          if-no-files-found: error
