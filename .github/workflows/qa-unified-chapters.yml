name: Chapter 1-2 Unified Result QA
on:
  push:
    branches:
      - feat/unified-chapter1-chapter2-result-20261011
  pull_request:
    branches:
      - release/chapter1-chapter2-launch-gate-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-chapter1-chapter2-result-20261011
      - run: npm ci
      - name: Audit unified RPG chapters without changing frozen core
        run: |
          node scripts/qa-chapters-unified.mjs
          npm run qa:chapter2-v31
          npm run qa:chapter2-v32
          npm run qa:result-v5
          npm run qa:money-result-content
          npm run qa:money-public-flow
          npm run qa:resume
      - name: Install Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Build isolated 2-chapter journey, no GAS endpoints
        env:
          VITE_CHAPTER2_V32: '1'
          VITE_MONEY_PERSONALITY_DATA_COHORT: PILOT
          VITE_MONEY_PERSONALITY_GAS_URL: ''
          VITE_MUDAGIRI_GAS_URL: ''
        run: |
          npm run build
          mkdir -p site/pilot/chapter2-v32/pilot/money-type
          cp -R dist/. site/pilot/chapter2-v32/
          cp -R dist/. site/pilot/chapter2-v32/pilot/money-type/
          if grep -R -l -E 'script.google.com/macros/s/.+/exec' site/pilot/chapter2-v32/assets/*.js; then
            echo "Unexpected GAS URL in preview"
            exit 1
          fi
      - name: Start static QA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/unified-qa.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/pilot/chapter2-v32/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/unified-qa.log
          exit 1
      - name: Entire Chapter1-Chapter2 quest Chromium
        env:
          BROWSER_ENGINE: chromium
          INTEGRATION_URL: http://127.0.0.1:4173/pilot/chapter2-v32/
        run: node qa-chapters-v32-browser.mjs
      - name: Entire Chapter1-Chapter2 quest iOS WebKit
        env:
          BROWSER_ENGINE: webkit
          INTEGRATION_URL: http://127.0.0.1:4173/pilot/chapter2-v32/
        run: node qa-chapters-v32-browser.mjs
      - name: Save unified world mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-chapter1-chapter2-mobile-qa
          path: integration-v32-mobile-qa/
          if-no-files-found: warn
          retention-days: 14
