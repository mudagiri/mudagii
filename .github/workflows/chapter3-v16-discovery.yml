name: Chapter 3 V1.6 Future Discovery QA
on:
  push:
    branches:
      - feat/chapter3-v16-future-discovery-20261019
    paths:
      - "public/pilot/chapter3-v16/**"
      - "scripts/qa-chapter3-v16-discovery.mjs"
      - "scripts/qa-chapter3-v16-journey.mjs"
      - ".github/workflows/chapter3-v16-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-chapter3:
    name: Pure engine + full journeys in Chromium / iPhone WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      VITE_MUDAGIRI_GAS_URL: ""
      VITE_MONEY_PERSONALITY_GAS_URL: ""
      VITE_CHAPTER3_PREVIEW: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install QA runner
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
      - name: Confirm V1.6 pure logic and scripts
        run: |
          node --check public/pilot/chapter3-v16/engine.mjs
          node --check public/pilot/chapter3-v16/stage.mjs
          node --check scripts/qa-chapter3-v16-discovery.mjs
          node --check scripts/qa-chapter3-v16-journey.mjs
          node scripts/qa-chapter3-v16-discovery.mjs
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' public/pilot/chapter3-v16 || exit 1
      - name: Build completely separate Chapter 3 V1.6
        run: |
          npm run build
          test -s dist/pilot/chapter3-v16/index.html
          test -s dist/pilot/chapter3-v16/stage.mjs
          test -s dist/pilot/chapter3-v16/engine.mjs
          test -s dist/pilot/chapter3-v16/stage.css
          test -s dist/assets/mudagiri/poses/v1/MUDAGIRI_POSE_03_GUIDE.webp
          test -s dist/assets/mudagiri/poses/v1/MUDAGIRI_POSE_23_RESULT.webp
          test -s dist/assets/mudagiri/poses/v1/MUDAGIRI_POSE_20_CHECK.webp
      - name: Start static source preview (no backend)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/chapter3-v16.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/pilot/chapter3-v16/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/chapter3-v16.log
          exit 1
      - name: Real browser QA - 8 types across mobile widths
        env:
          CH3_V16_URL: http://127.0.0.1:4173/pilot/chapter3-v16/
        run: node scripts/qa-chapter3-v16-journey.mjs
      - name: Upload V1.6 screenshots and inspectable outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter3-v16-mobile-review
          path: artifacts/chapter3-v16/
          if-no-files-found: warn
          retention-days: 14
