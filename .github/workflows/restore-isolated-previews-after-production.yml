name: Restore Isolated Previews After Production Deployment

on:
  workflow_run:
    workflows: ["Deploy Mudagiri to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  assemble:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pilot-hidden-preview
    outputs:
      integration_sha: ${{ steps.capture.outputs.integration_sha }}
      pilot_sha: ${{ steps.capture.outputs.pilot_sha }}
      production_sha: ${{ steps.capture.outputs.production_sha }}
      root_index_sha: ${{ steps.assemble.outputs.root_index_sha }}
      v3_sha: ${{ steps.capture.outputs.v3_sha }}
      v31_sha: ${{ steps.capture.outputs.v31_sha }}
      v32_sha: ${{ steps.capture.outputs.v32_sha }}
      chapter3_sha: ${{ steps.capture.outputs.chapter3_sha }}
      chapter3_v15_sha: ${{ steps.capture.outputs.chapter3_v15_sha }}
      answercheck_sha: ${{ steps.capture.outputs.answercheck_sha }}
    steps:
      - name: Checkout unchanged production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-site

      - name: Checkout existing Chapter 1 hidden preview
        uses: actions/checkout@v4
        with:
          ref: feature/money-personality-pilot
          path: pilot-site

      - name: Checkout integrated Chapter 2 V2 candidate
        uses: actions/checkout@v4
        with:
          ref: integration/chapter1-chapter2-v2-20261009
          path: integrated-site

      - name: Checkout separate V3 candidate
        uses: actions/checkout@v4
        with:
          ref: feat/chapter2-result-v3-world-impact-20261009
          path: v3-site

      - name: Checkout V31 RPG reward implementation
        uses: actions/checkout@v4
        with:
          ref: feat/chapter2-result-v31-guild-reward-20261011
          path: v31-site

      - name: Checkout isolated V32 possibility-first result
        uses: actions/checkout@v4
        with:
          ref: release/chapter12-latest-rpg-ui-first-20261016
          path: v32-site

      - name: Checkout separate Chapter 3 RPG pilot
        uses: actions/checkout@v4
        with:
          ref: feat/chapter3-rpg-pilot-v16-20261011
          path: chapter3-site

      # Chapter 3 V1.5 is self-contained static ES modules and does not touch C1/C2.
      - name: Checkout isolated Chapter 3 V1.5 candidate
        uses: actions/checkout@v4
        with:
          ref: feat/chapter3-v11-rpg-result-isolated-20261017
          path: chapter3-v15-site

      - name: Checkout separate Chapter 1-2 answer-check visual pilot
        uses: actions/checkout@v4
        with:
          ref: fix/final-contract-benchmark-alignment-20261015
          path: answercheck-site

      - name: Capture source revisions
        id: capture
        run: |
          echo "production_sha=$(git -C production-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pilot_sha=$(git -C pilot-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "integration_sha=$(git -C integrated-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "v3_sha=$(git -C v3-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "v31_sha=$(git -C v31-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "v32_sha=$(git -C v32-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Check scripts required during assembled preview publishing up front.
          # Prevent another costly multi-chapter build that ultimately publishes nothing.
          test -s v32-site/scripts/prepare-money-personality-preview-og.mjs
          test -s v31-site/scripts/prepare-money-personality-preview-og.mjs
          test -f v32-site/qa-chapter2-v32.ts
          echo "V32_PREVIEW_PUBLISH_PREREQUISITES_PASS"
          echo "chapter3_sha=$(git -C chapter3-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "chapter3_v15_sha=$(git -C chapter3-v15-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "answercheck_sha=$(git -C answercheck-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            production-site/package-lock.json
            pilot-site/package-lock.json
            integrated-site/package-lock.json
            v3-site/package-lock.json
            v31-site/package-lock.json
            v32-site/package-lock.json
            chapter3-site/package-lock.json
            answercheck-site/package-lock.json

      - name: Build unchanged public root
        working-directory: production-site
        env:
          VITE_MUDAGIRI_GAS_URL: ${{ secrets.VITE_MUDAGIRI_GAS_URL }}
        run: |
          npm ci
          npm run build

      - name: Informational dedicated Chapter 1 GAS health (GET only, no saving)
        working-directory: integrated-site
        env:
          VITE_MONEY_PERSONALITY_GAS_URL: ${{ secrets.VITE_MONEY_PERSONALITY_GAS_URL || vars.VITE_MONEY_PERSONALITY_GAS_URL }}
        run: |
          if ! node scripts/check-money-personality-gas-health.mjs; then
            echo "::warning::Dedicated Chapter 1 GAS GET was unavailable. This isolated V31 preview does not send any GAS data."
          fi

      - name: Rebuild existing Chapter 1 hidden preview
        working-directory: pilot-site
        env:
          VITE_MUDAGIRI_GAS_URL: ${{ secrets.VITE_MUDAGIRI_GAS_URL }}
          VITE_MONEY_PERSONALITY_GAS_URL: ${{ secrets.VITE_MONEY_PERSONALITY_GAS_URL || vars.VITE_MONEY_PERSONALITY_GAS_URL }}
          VITE_MONEY_PERSONALITY_DATA_COHORT: PILOT
        run: |
          npm ci
          npm run build
          npm run qa:money-pilot

      - name: Build integrated hidden preview with GAS saving disabled
        working-directory: integrated-site
        env:
          VITE_CHAPTER2_V2: "1"
          VITE_MONEY_PERSONALITY_DATA_COHORT: PILOT
          VITE_MONEY_PERSONALITY_GAS_URL: ""
          VITE_MUDAGIRI_GAS_URL: ""
        run: |
          npm ci
          npm run build
          npm run qa:chapter2-v2
          npm run qa:money-entry
          npm run qa:money-public-flow
          npm run qa:money-engine
          npm run qa:resume
          npm run qa:result-v5

      - name: Build V3 preview without GAS saving
        working-directory: v3-site
        env:
          VITE_CHAPTER2_V3: "1"
          VITE_MONEY_PERSONALITY_DATA_COHORT: PILOT
          VITE_MONEY_PERSONALITY_GAS_URL: ""
          VITE_MUDAGIRI_GAS_URL: ""
        run: |
          npm ci
          npm run build
          npm run qa:chapter2-v3
          npm run qa:chapter2-v2
          npm run qa:money-entry
          npm run qa:money-public-flow
          npm run qa:money-engine
          npm run qa:resume

      - name: Build V31 RPG hidden preview without GAS saving
        working-directory: v31-site
        env:
          VITE_CHAPTER2_V31: "1"
          VITE_MONEY_PERSONALITY_DATA_COHORT: PILOT
          VITE_MONEY_PERSONALITY_GAS_URL: ""
          VITE_MUDAGIRI_GAS_URL: ""
        run: |
          npm ci
          npm run build
          npm run qa:chapter2-v2
          npm run qa:chapter2-v3
          npm run qa:chapter2-v31
          npm run qa:money-entry
          npm run qa:money-public-flow
          npm run qa:money-engine
          npm run qa:resume
          npm run qa:result-v5

      - name: Build V32 RPG hidden preview without GAS saving
        working-directory: v32-site
        env:
          VITE_CHAPTER2_V32: "1"
          VITE_MONEY_PERSONALITY_DATA_COHORT: PILOT
          VITE_MONEY_PERSONALITY_GAS_URL: ""
          VITE_MUDAGIRI_GAS_URL: ""
        run: |
          npm ci
          npm run build
          npm run qa:public-chapter12-entry
          npm run qa:chapter2-v2
          npm run qa:result-v5
          npm run qa:resume
          npx --yes tsx@4.20.6 qa-age-income-joint-burden-gate-v1.ts
          npx --yes tsx@4.20.6 qa-chapter2-v32.ts
          test -f dist/index.html
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' dist/assets/*.js

      - name: Build separate Chapter 3 static pilot with no GAS
        working-directory: chapter3-site
        env:
          VITE_MUDAGIRI_GAS_URL: ""
          VITE_MONEY_PERSONALITY_GAS_URL: ""
          VITE_MONEY_PERSONALITY_DATA_COHORT: PILOT
        run: |
          npm ci
          npm run build
          npm run qa:chapter3-insight
          test -f dist/chapter3-pilot.html
          test -f dist/chapter3-v21.html
          npm run qa:chapter3-life-fork
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' dist/assets/*.js

      - name: Validate isolated Chapter 3 V1.5 learning guides and JS
        working-directory: chapter3-v15-site
        run: |
          node scripts/qa-chapter3-guides-v15.mjs
          node --check public/pilot/chapter3-v12/stage.mjs
          node --check public/pilot/chapter3-v12/engine.mjs
          node --check public/pilot/chapter3-v12/story.mjs
          node --check public/pilot/chapter3-v12/motivation.mjs
          node --check public/pilot/chapter3-v12/next-guide.mjs

      - name: Build isolated chapter1-chapter2 answer check without GAS
        working-directory: answercheck-site
        env:
          VITE_MUDAGIRI_GAS_URL: ""
          VITE_MONEY_PERSONALITY_GAS_URL: ""
          VITE_MONEY_PERSONALITY_DATA_COHORT: PILOT
        run: |
          npm ci
          npm run build
          npm run qa:chapter2-v32
          node scripts/qa-chapter12-answercheck-experiment-v1.mjs
          node scripts/qa-coverage-awareness-v1.mjs
          node scripts/qa-coverage-consult-handoff-v1.mjs
          test -f dist/chapter12-answercheck.html
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' dist/assets/*.js

      - name: Preserve current site paths and add integrated preview subtree
        id: assemble
        run: |
          set -euo pipefail
          mkdir -p site
          cp -R production-site/dist/. site/
          mkdir -p site/pilot/money-type
          cp -R pilot-site/dist/. site/pilot/money-type/
          git -C pilot-site rev-parse HEAD > site/pilot/money-type/REVISION_SHA.txt
          node pilot-site/scripts/prepare-money-personality-preview-og.mjs site/pilot/money-type/index.html

          mkdir -p site/pilot/chapter2-v2/pilot/money-type
          cp -R integrated-site/dist/. site/pilot/chapter2-v2/
          cp -R integrated-site/dist/. site/pilot/chapter2-v2/pilot/money-type/
          git -C integrated-site rev-parse HEAD > site/pilot/chapter2-v2/REVISION_SHA.txt
          git -C integrated-site rev-parse HEAD > site/pilot/chapter2-v2/pilot/money-type/REVISION_SHA.txt
          node integrated-site/scripts/prepare-money-personality-preview-og.mjs site/pilot/chapter2-v2/pilot/money-type/index.html

          # Entirely separate V3 subtree. Keep both existing V2 entry points intact.
          mkdir -p site/pilot/chapter2-v3/pilot/money-type
          cp -R v3-site/dist/. site/pilot/chapter2-v3/
          cp -R v3-site/dist/. site/pilot/chapter2-v3/pilot/money-type/
          git -C v3-site rev-parse HEAD > site/pilot/chapter2-v3/REVISION_SHA.txt
          git -C v3-site rev-parse HEAD > site/pilot/chapter2-v3/pilot/money-type/REVISION_SHA.txt
          node v3-site/scripts/prepare-money-personality-preview-og.mjs site/pilot/chapter2-v3/pilot/money-type/index.html

          # V3.1 lives under a separate prefix. Do not replace V3 or any public path.
          mkdir -p site/pilot/chapter2-v31/pilot/money-type
          cp -R v31-site/dist/. site/pilot/chapter2-v31/
          cp -R v31-site/dist/. site/pilot/chapter2-v31/pilot/money-type/
          git -C v31-site rev-parse HEAD > site/pilot/chapter2-v31/REVISION_SHA.txt
          git -C v31-site rev-parse HEAD > site/pilot/chapter2-v31/pilot/money-type/REVISION_SHA.txt
          node v31-site/scripts/prepare-money-personality-preview-og.mjs site/pilot/chapter2-v31/pilot/money-type/index.html

          # V3.2 is isolated: published V3.1 and all older preview roots remain unchanged.
          mkdir -p site/pilot/chapter2-v32/pilot/money-type
          cp -R v32-site/dist/. site/pilot/chapter2-v32/
          cp -R v32-site/dist/. site/pilot/chapter2-v32/pilot/money-type/
          git -C v32-site rev-parse HEAD > site/pilot/chapter2-v32/REVISION_SHA.txt
          git -C v32-site rev-parse HEAD > site/pilot/chapter2-v32/pilot/money-type/REVISION_SHA.txt
          node v32-site/scripts/prepare-money-personality-preview-og.mjs site/pilot/chapter2-v32/pilot/money-type/index.html

          # Chapter 3 is a new isolated subtree, never a replacement for existing pages.
          mkdir -p site/pilot/chapter3-v16
          cp -R chapter3-site/dist/. site/pilot/chapter3-v16/
          git -C chapter3-site rev-parse HEAD > site/pilot/chapter3-v16/REVISION_SHA.txt
          test -f site/pilot/chapter3-v16/chapter3-pilot.html
          test -f site/pilot/chapter3-v16/chapter3-v21.html
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' site/pilot/chapter3-v16/assets/*.js

          # Chapter 3 V1.5 separate static subtree with self-contained local assets.
          # Rewrite asset references only in assembled files, never in the source branch.
          # Do not touch production files, shared assets or frozen Chapter 1/2 files.
          mkdir -p site/pilot/chapter3-v12
          cp -R chapter3-v15-site/public/pilot/chapter3-v12/. site/pilot/chapter3-v12/
          git -C chapter3-v15-site rev-parse HEAD > site/pilot/chapter3-v12/REVISION_SHA.txt
          sed -i 's#../../assets/#./assets/#g' site/pilot/chapter3-v12/index.html site/pilot/chapter3-v12/stage.mjs site/pilot/chapter3-v12/stage.css
          for asset in \
            brand/favicon-32.png \
            mudagiri/poses/v1/MUDAGIRI_POSE_03_GUIDE.webp \
            mudagiri/poses/v1/MUDAGIRI_POSE_20_CHECK.webp \
            mudagiri/poses/v1/MUDAGIRI_POSE_23_RESULT.webp \
            mudagiri/backgrounds/money-personality/v1/MP_BG_01_GUILD_HALL.webp \
            mudagiri/backgrounds/money-personality/v1/MP_BG_03_NEXT_QUEST.webp \
            jobs/v1/JOB_01_FDM_elephant.webp; do
            source="chapter3-v15-site/public/assets/$asset"
            target="site/pilot/chapter3-v12/assets/$asset"
            test -s "$source"
            mkdir -p "$(dirname "$target")"
            cp "$source" "$target"
            test -s "$target"
          done
          test -f site/pilot/chapter3-v12/index.html
          test -f site/pilot/chapter3-v12/ux-v15.css
          test -f site/pilot/chapter3-v12/next-guide.mjs
          grep -q 'const ART="./assets/"' site/pilot/chapter3-v12/stage.mjs
          grep -q 'id="chapter3-stage"' site/pilot/chapter3-v12/index.html
          ! grep -R -E -l 'script.google.com/macros/s/.+/exec' site/pilot/chapter3-v12
          echo "CHAPTER3_V15_STATIC_ASSEMBLY_PASS"

          # Answer check only exists in a separate mock-data subtree.
          mkdir -p site/pilot/chapter12-answercheck-v1
          cp -R answercheck-site/dist/. site/pilot/chapter12-answercheck-v1/
          git -C answercheck-site rev-parse HEAD > site/pilot/chapter12-answercheck-v1/REVISION_SHA.txt
          test -f site/pilot/chapter12-answercheck-v1/chapter12-answercheck.html
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' site/pilot/chapter12-answercheck-v1/assets/*.js

          cmp production-site/dist/index.html site/index.html
          test -f site/pilot/money-type/index.html
          test -f site/pilot/chapter2-v2/index.html
          test -f site/pilot/chapter2-v2/pilot/money-type/index.html
          test -f site/pilot/chapter2-v3/index.html
          test -f site/pilot/chapter2-v3/pilot/money-type/index.html
          test -f site/pilot/chapter2-v31/index.html
          test -f site/pilot/chapter2-v31/pilot/money-type/index.html
          test -f site/pilot/chapter2-v32/index.html
          test -f site/pilot/chapter2-v32/pilot/money-type/index.html
          test "$(cat site/pilot/money-type/REVISION_SHA.txt)" = "$(git -C pilot-site rev-parse HEAD)"
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' site/pilot/chapter2-v2/assets/*.js
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' site/pilot/chapter2-v2/pilot/money-type/assets/*.js
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' site/pilot/chapter2-v3/assets/*.js
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' site/pilot/chapter2-v3/pilot/money-type/assets/*.js
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' site/pilot/chapter2-v31/assets/*.js
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' site/pilot/chapter2-v31/pilot/money-type/assets/*.js
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' site/pilot/chapter2-v32/assets/*.js
          ! grep -R -l -E 'script.google.com/macros/s/.+/exec' site/pilot/chapter2-v32/pilot/money-type/assets/*.js
          echo "root_index_sha=$(sha256sum site/index.html | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "ASSEMBLY_PRESERVES_PRODUCTION_ROOT_AND_EXISTING_PILOT"
          du -sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          name: pages-chapters-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: pilot-hidden-preview
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Restore production and all isolated pilots after root deployment
        id: pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-chapters-integration-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify published versions and original site
        shell: bash
        env:
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
          EXPECTED_INTEGRATION: ${{ needs.assemble.outputs.integration_sha }}
          EXPECTED_PILOT: ${{ needs.assemble.outputs.pilot_sha }}
          EXPECTED_ROOT_SHA: ${{ needs.assemble.outputs.root_index_sha }}
          EXPECTED_V3: ${{ needs.assemble.outputs.v3_sha }}
          EXPECTED_V31: ${{ needs.assemble.outputs.v31_sha }}
          EXPECTED_V32: ${{ needs.assemble.outputs.v32_sha }}
          EXPECTED_CHAPTER3: ${{ needs.assemble.outputs.chapter3_sha }}
          EXPECTED_CHAPTER3_V15: ${{ needs.assemble.outputs.chapter3_v15_sha }}
          EXPECTED_ANSWERCHECK: ${{ needs.assemble.outputs.answercheck_sha }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          base="$(printf '%s' "$PAGE_URL" | sed 's#/$##')"
          for i in $(seq 1 15); do
            integrated="$(curl -fsSL --max-time 12 "$base/pilot/chapter2-v2/REVISION_SHA.txt" 2>/dev/null | tr -d '\r\n' || true)"
            existing="$(curl -fsSL --max-time 12 "$base/pilot/money-type/REVISION_SHA.txt" 2>/dev/null | tr -d '\r\n' || true)"
            v3="$(curl -fsSL --max-time 12 "$base/pilot/chapter2-v3/REVISION_SHA.txt" 2>/dev/null | tr -d '\r\n' || true)"
            v31="$(curl -fsSL --max-time 12 "$base/pilot/chapter2-v31/REVISION_SHA.txt" 2>/dev/null | tr -d '\r\n' || true)"
            v32="$(curl -fsSL --max-time 12 "$base/pilot/chapter2-v32/REVISION_SHA.txt" 2>/dev/null | tr -d '\r\n' || true)"
            chapter3="$(curl -fsSL --max-time 12 "$base/pilot/chapter3-v16/REVISION_SHA.txt" 2>/dev/null | tr -d '\r\n' || true)"
            chapter3_v15="$(curl -fsSL --max-time 12 "$base/pilot/chapter3-v12/REVISION_SHA.txt" 2>/dev/null | tr -d '\r\n' || true)"
            answercheck="$(curl -fsSL --max-time 12 "$base/pilot/chapter12-answercheck-v1/REVISION_SHA.txt" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$integrated" = "$EXPECTED_INTEGRATION" ] && [ "$existing" = "$EXPECTED_PILOT" ] && [ "$v3" = "$EXPECTED_V3" ] && [ "$v31" = "$EXPECTED_V31" ] && [ "$v32" = "$EXPECTED_V32" ] && [ "$chapter3" = "$EXPECTED_CHAPTER3" ] && [ "$chapter3_v15" = "$EXPECTED_CHAPTER3_V15" ] && [ "$answercheck" = "$EXPECTED_ANSWERCHECK" ]; then
              curl -fsSL --max-time 12 "$base/" -o /tmp/production-root.html
              curl -fsSL --max-time 12 "$base/pilot/chapter2-v2/" -o /tmp/chapter2-v2.html
              curl -fsSL --max-time 12 "$base/pilot/chapter2-v2/pilot/money-type/" -o /tmp/chapter1.html
              curl -fsSL --max-time 12 "$base/pilot/chapter2-v3/" -o /tmp/chapter2-v3.html
              curl -fsSL --max-time 12 "$base/pilot/chapter2-v3/pilot/money-type/" -o /tmp/chapter1-v3.html
              curl -fsSL --max-time 12 "$base/pilot/chapter2-v31/" -o /tmp/chapter2-v31.html
              curl -fsSL --max-time 12 "$base/pilot/chapter2-v31/pilot/money-type/" -o /tmp/chapter1-v31.html
              curl -fsSL --max-time 12 "$base/pilot/chapter2-v32/" -o /tmp/chapter2-v32.html
              curl -fsSL --max-time 12 "$base/pilot/chapter2-v32/pilot/money-type/" -o /tmp/chapter1-v32.html
              curl -fsSL --max-time 12 "$base/pilot/chapter3-v16/chapter3-pilot.html" -o /tmp/chapter3-v16.html
              curl -fsSL --max-time 12 "$base/pilot/chapter3-v16/chapter3-v21.html" -o /tmp/chapter3-v21.html
              curl -fsSL --max-time 12 "$base/pilot/chapter3-v12/" -o /tmp/chapter3-v15.html
              curl -fsSL --max-time 12 "$base/pilot/chapter3-v12/stage.mjs" -o /tmp/chapter3-v15-stage.mjs
              curl -fsSL --max-time 12 "$base/pilot/chapter3-v12/assets/mudagiri/poses/v1/MUDAGIRI_POSE_03_GUIDE.webp" -o /tmp/chapter3-v15-mascot.webp
              curl -fsSL --max-time 12 "$base/pilot/chapter12-answercheck-v1/chapter12-answercheck.html" -o /tmp/chapter12-answercheck.html
              test "$(sha256sum /tmp/production-root.html | cut -d ' ' -f1)" = "$EXPECTED_ROOT_SHA"
              grep -q 'id="root"' /tmp/chapter1.html
              grep -q 'id="root"' /tmp/chapter2-v2.html
              grep -q 'id="root"' /tmp/chapter2-v3.html
              grep -q 'id="root"' /tmp/chapter1-v3.html
              grep -q 'id="root"' /tmp/chapter2-v31.html
              grep -q 'id="root"' /tmp/chapter1-v31.html
              grep -q 'id="root"' /tmp/chapter2-v32.html
              grep -q 'id="root"' /tmp/chapter1-v32.html
              grep -q 'id="chapter3-pilot-root"' /tmp/chapter3-v16.html
              grep -q 'id="chapter3-life-fork-root"' /tmp/chapter3-v21.html
              grep -q 'id="chapter3-stage"' /tmp/chapter3-v15.html
              grep -q 'CH3 ONLY' /tmp/chapter3-v15-stage.mjs
