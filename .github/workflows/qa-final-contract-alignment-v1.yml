name: P0 Final Contract Candidate Gate
on:
  push:
    branches:
      - fix/final-contract-benchmark-alignment-20261015
  pull_request:
    branches:
      - design/chapter12-personality-household-answercheck-v1-20261012
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: final-contract-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: {image: "mcr.microsoft.com/playwright:v1.55.0-noble"}
    env:
      VITE_MUDAGIRI_GAS_URL: ""
      VITE_MONEY_PERSONALITY_GAS_URL: ""
      VITE_MONEY_PERSONALITY_DATA_COHORT: "PILOT"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned project dependencies
        run: npm ci
      - name: Build and verify all 12-category contracts
        run: |
          npm run build
          npm run qa:resolver
          npm run qa:scope
          npm run qa:result-v5
          npm run qa:chapter2-v32
          node scripts/qa-final-contract-canonical-owner-v1.mjs
          node qa-final-contract-release-readiness-v1.mjs
          npm run qa:result-v5-calibration
          npm run qa:10k
          npm run qa:persona
          npm run qa:resume
          npm run qa:result-safety
          npm run qa:line-handoff
          npx --yes tsx@4.20.6 qa-line-gas-order-v1.ts
          npm run qa:chapter2-v2
      - name: Install browser testing dependencies
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Start isolated pilot without production endpoints
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/chapter12-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/chapter12-answercheck.html >/dev/null; then exit 0; fi
            sleep 0.3
          done
          cat /tmp/chapter12-preview.log
          exit 1
      - name: Chromium 320 375 390 430
        env: {BROWSER_ENGINE: chromium, CHAPTER12_URL: "http://127.0.0.1:4173/chapter12-answercheck.html"}
        run: node scripts/qa-chapter12-answercheck-browser.mjs
      - name: WebKit 320 375 390 430
        env: {BROWSER_ENGINE: webkit, CHAPTER12_URL: "http://127.0.0.1:4173/chapter12-answercheck.html"}
        run: node scripts/qa-chapter12-answercheck-browser.mjs
      - name: Chromium Chapter 2 real entry and resume
        env: {BROWSER_ENGINE: chromium, MUDAGIRI_ENTRY_URL: "http://127.0.0.1:4173/index.html?chapter2v32=1"}
        run: node scripts/qa-chapter2-entry-mobile-v1.mjs
      - name: WebKit Chapter 2 real entry and resume
        env: {BROWSER_ENGINE: webkit, MUDAGIRI_ENTRY_URL: "http://127.0.0.1:4173/index.html?chapter2v32=1"}
        run: node scripts/qa-chapter2-entry-mobile-v1.mjs
      - name: Attach privacy-safe synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-contract-candidate-synthetic-screens
          path: |
            chapter12-answercheck-qa/
            chapter2-entry-qa/
          if-no-files-found: warn
          retention-days: 14
