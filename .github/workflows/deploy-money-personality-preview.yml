name: Deploy Money Personality Preview

on:
  push:
    branches:
      - feature/money-personality-pilot

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: money-personality-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Checkout current preview commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pilot-site

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main-site/package-lock.json
            pilot-site/package-lock.json

      - name: Build current production root
        working-directory: main-site
        env:
          VITE_MUDAGIRI_GAS_URL: ${{ secrets.VITE_MUDAGIRI_GAS_URL }}
        run: |
          npm ci
          npm run build

      - name: Validate and build money personality preview
        working-directory: pilot-site
        env:
          VITE_MUDAGIRI_GAS_URL: ${{ secrets.VITE_MUDAGIRI_GAS_URL }}
        run: |
          npm ci
          npm run build
          npm run qa:money-engine
          npm run qa:money-separators
          npm run qa:money-public-flow

      - name: Assemble production root plus preview
        run: |
          mkdir -p site
          cp -R main-site/dist/. site/
          mkdir -p site/pilot/money-type
          cp -R pilot-site/dist/. site/pilot/money-type/
          test -f site/index.html
          test -f site/pilot/money-type/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy production root with latest money personality preview
        id: deployment
        uses: actions/deploy-pages@v4
