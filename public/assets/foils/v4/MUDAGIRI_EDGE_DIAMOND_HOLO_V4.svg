<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120">
<defs>
  <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42e5ff"/><stop offset=".48" stop-color="#4f75ff"/><stop offset="1" stop-color="#bd55ff"/></linearGradient>
  <linearGradient id="g" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#fff176"/><stop offset=".5" stop-color="#ff9a3d"/><stop offset="1" stop-color="#ff5cab"/></linearGradient>
  <linearGradient id="m" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#68f0b7"/><stop offset=".48" stop-color="#43d9f4"/><stop offset="1" stop-color="#7966ff"/></linearGradient>
  <linearGradient id="w" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#d8f5ff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation=".8"/></filter>
</defs>

<!-- strong faceted foil only around the perimeter; center is intentionally clear -->
<g opacity=".88" filter="url(#glow)">
