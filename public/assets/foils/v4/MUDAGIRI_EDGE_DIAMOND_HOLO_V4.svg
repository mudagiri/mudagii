  <polygon points="82,1008 158,1074 112,946" fill="url(#w)" opacity=".42"/>
  <polygon points="640,1000 568,1072 606,946" fill="url(#w)" opacity=".44"/>
</g>

<!-- subtle etched diamond outlines only near border -->
<g fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1">
  <path d="M20 44l40-28 42 30-42 34zM108 30l44-26 40 32-42 34zM528 34l42-28 42 30-42 34zM616 42l42-30 42 32-42 36z"/>
