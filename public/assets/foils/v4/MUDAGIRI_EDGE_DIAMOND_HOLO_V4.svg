  <!-- right edge -->
  <polygon points="720,86 634,44 720,170" fill="url(#g)" opacity=".80"/>
  <polygon points="720,170 628,128 720,258" fill="url(#c)" opacity=".86"/>
  <polygon points="720,258 644,218 720,340" fill="url(#m)" opacity=".70"/>
  <polygon points="720,340 626,300 720,430" fill="url(#g)" opacity=".72"/>
  <polygon points="720,430 642,392 720,520" fill="url(#c)" opacity=".82"/>
  <polygon points="720,616 632,574 720,704" fill="url(#m)" opacity=".74"/>
  <polygon points="720,704 646,668 720,790" fill="url(#g)" opacity=".70"/>
  <polygon points="720,790 628,750 720,878" fill="url(#c)" opacity=".84"/>
  <polygon points="720,878 642,842 720,970" fill="url(#m)" opacity=".70"/>
