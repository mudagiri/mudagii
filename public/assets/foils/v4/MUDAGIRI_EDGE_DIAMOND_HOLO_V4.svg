</g>

<!-- sparse hot sparks -->
<g fill="#fff">
  <circle cx="66" cy="112" r="2.4" opacity=".88"/>
  <circle cx="652" cy="146" r="2.2" opacity=".82"/>
  <circle cx="76" cy="522" r="2.1" opacity=".76"/>
  <circle cx="648" cy="604" r="2.3" opacity=".82"/>
