  <polygon points="230,0 312,0 274,68" fill="url(#c)" opacity=".66"/>
  <polygon points="408,0 490,0 448,72" fill="url(#g)" opacity=".68"/>
  <polygon points="490,0 570,0 532,94" fill="url(#c)" opacity=".78"/>
  <polygon points="570,0 648,0 608,72" fill="url(#m)" opacity=".72"/>
  <polygon points="648,0 720,0 682,86" fill="url(#g)"/>

  <!-- left edge -->
  <polygon points="0,82 84,42 0,160" fill="url(#m)" opacity=".72"/>
  <polygon points="0,160 92,116 0,242" fill="url(#c)" opacity=".82"/>
  <polygon points="0,242 76,206 0,326" fill="url(#g)" opacity=".68"/>
  <polygon points="0,326 94,286 0,414" fill="url(#c)" opacity=".76"/>
  <polygon points="0,414 82,378 0,508" fill="url(#m)" opacity=".66"/>
  <polygon points="0,612 90,570 0,700" fill="url(#g)" opacity=".72"/>
  <polygon points="0,700 76,664 0,792" fill="url(#c)" opacity=".78"/>
  <polygon points="0,792 94,748 0,884" fill="url(#m)" opacity=".70"/>
  <polygon points="0,884 82,846 0,978" fill="url(#g)" opacity=".76"/>
