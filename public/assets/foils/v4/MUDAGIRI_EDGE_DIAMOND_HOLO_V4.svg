  <!-- bottom edge -->
  <polygon points="0,1120 78,1120 40,1036" fill="url(#g)"/>
  <polygon points="78,1120 156,1120 118,1048" fill="url(#c)" opacity=".72"/>
  <polygon points="156,1120 236,1120 196,1032" fill="url(#m)" opacity=".70"/>
  <polygon points="236,1120 318,1120 278,1046" fill="url(#g)" opacity=".68"/>
  <polygon points="404,1120 486,1120 446,1042" fill="url(#c)" opacity=".70"/>
  <polygon points="486,1120 566,1120 528,1034" fill="url(#m)" opacity=".74"/>
  <polygon points="566,1120 646,1120 608,1048" fill="url(#g)" opacity=".72"/>
  <polygon points="646,1120 720,1120 682,1038" fill="url(#c)"/>

